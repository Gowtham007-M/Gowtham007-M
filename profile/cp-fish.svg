<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="100%" height="110" role="img" aria-label="Neon cyber-fish swimming through data streams">
  <defs>
    <filter id="cpf-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="110" fill="#05070A"/>

  <g stroke="#22D3EE" stroke-width="0.5" opacity="0.05">
    <line x1="0" y1="26" x2="900" y2="26"/><line x1="0" y1="52" x2="900" y2="52"/>
    <line x1="0" y1="78" x2="900" y2="78"/>
  </g>

  <g fill="#22D3EE">
    <rect x="120" y="-22" width="3" height="16" opacity="0.5">
      <animate attributeName="y" values="-22;110" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="290" y="-22" width="3" height="14" opacity="0.4">
      <animate attributeName="y" values="-22;110" dur="8s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="8s" repeatCount="indefinite" begin="1.5s"/>
    </rect>
    <rect x="470" y="-22" width="3" height="16" opacity="0.45">
      <animate attributeName="y" values="-22;110" dur="5.5s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="5.5s" repeatCount="indefinite" begin="0.8s"/>
    </rect>
    <rect x="650" y="-22" width="3" height="13" opacity="0.4">
      <animate attributeName="y" values="-22;110" dur="7s" repeatCount="indefinite" begin="2.2s"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="7s" repeatCount="indefinite" begin="2.2s"/>
    </rect>
    <rect x="800" y="-22" width="3" height="16" opacity="0.5">
      <animate attributeName="y" values="-22;110" dur="6.5s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="6.5s" repeatCount="indefinite" begin="0.4s"/>
    </rect>
  </g>

  <g opacity="0.5">
    <rect x="70" y="80" width="4" height="4" fill="#A78BFA">
      <animate attributeName="opacity" values="0.9;0" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="82;34" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="220" y="80" width="4" height="4" fill="#F472B6">
      <animate attributeName="opacity" values="0.9;0" dur="3.1s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="y" values="82;36" dur="3.1s" repeatCount="indefinite" begin="1s"/>
    </rect>
    <rect x="590" y="80" width="4" height="4" fill="#A78BFA">
      <animate attributeName="opacity" values="0.9;0" dur="2.8s" repeatCount="indefinite" begin="1.7s"/>
      <animate attributeName="y" values="82;38" dur="2.8s" repeatCount="indefinite" begin="1.7s"/>
    </rect>
  </g>

  <g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-70 0;970 0;970 0;-70 0" keyTimes="0;0.25;0.75;1" dur="11s" repeatCount="indefinite"/>
      <g transform="translate(0 34)" filter="url(#cpf-glow)">
        <path d="M-20,0 C-14,-11 6,-12 14,-7 L22,0 L14,7 C6,12 -14,11 -20,0 Z" fill="#0F172A" stroke="#22D3EE" stroke-width="1.5"/>
        <polygon points="0,-10 8,-18 13,-9" fill="#A78BFA" opacity="0.75"/>
        <path d="M-14,-2 L8,-6" stroke="#22D3EE" stroke-width="1" opacity="0.5"/>
        <g transform="translate(-19 0)">
          <polygon points="0,-8 -13,-5 -13,5 0,8" fill="#F472B6" opacity="0.85">
            <animateTransform attributeName="transform" type="rotate" values="-14 0 0;14 0 0;-14 0 0" dur="0.6s" repeatCount="indefinite"/>
          </polygon>
        </g>
        <circle cx="12" cy="-3" r="4.5" fill="#22D3EE" opacity="0.35">
          <animate attributeName="opacity" values="0.35;0.7;0.35" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="12" cy="-3" r="2" fill="#FFFFFF"/>
      </g>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="970 0;-70 0;-70 0;970 0" keyTimes="0;0.25;0.75;1" dur="13s" repeatCount="indefinite"/>
      <g transform="translate(0 60) scale(-1 1)">
        <g transform="scale(0.82)" filter="url(#cpf-glow)">
          <path d="M-20,0 C-14,-11 6,-12 14,-7 L22,0 L14,7 C6,12 -14,11 -20,0 Z" fill="#0F172A" stroke="#22D3EE" stroke-width="1.5"/>
          <polygon points="0,-10 8,-18 13,-9" fill="#A78BFA" opacity="0.75"/>
          <path d="M-14,-2 L8,-6" stroke="#22D3EE" stroke-width="1" opacity="0.5"/>
          <g transform="translate(-19 0)">
            <polygon points="0,-8 -13,-5 -13,5 0,8" fill="#F472B6" opacity="0.85">
              <animateTransform attributeName="transform" type="rotate" values="-14 0 0;14 0 0;-14 0 0" dur="0.75s" repeatCount="indefinite"/>
            </polygon>
          </g>
          <circle cx="12" cy="-3" r="4.5" fill="#22D3EE" opacity="0.35">
            <animate attributeName="opacity" values="0.35;0.7;0.35" dur="1.8s" repeatCount="indefinite"/>
          </circle>
          <circle cx="12" cy="-3" r="2" fill="#FFFFFF"/>
        </g>
      </g>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="-70 0;970 0;970 0;-70 0" keyTimes="0;0.25;0.75;1" dur="8s" repeatCount="indefinite"/>
      <g transform="translate(0 88) scale(0.7)" filter="url(#cpf-glow)">
        <path d="M-20,0 C-14,-11 6,-12 14,-7 L22,0 L14,7 C6,12 -14,11 -20,0 Z" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
        <polygon points="0,-10 8,-18 13,-9" fill="#F472B6" opacity="0.75"/>
        <path d="M-14,-2 L8,-6" stroke="#06B6D4" stroke-width="1" opacity="0.5"/>
        <g transform="translate(-19 0)">
          <polygon points="0,-8 -13,-5 -13,5 0,8" fill="#A78BFA" opacity="0.85">
            <animateTransform attributeName="transform" type="rotate" values="-14 0 0;14 0 0;-14 0 0" dur="0.45s" repeatCount="indefinite"/>
          </polygon>
        </g>
        <circle cx="12" cy="-3" r="4.5" fill="#06B6D4" opacity="0.35">
          <animate attributeName="opacity" values="0.35;0.7;0.35" dur="1.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="12" cy="-3" r="2" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <line x1="0" y1="105" x2="900" y2="105" stroke="#22D3EE" stroke-width="1" stroke-dasharray="6 8" opacity="0.35">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.2s" repeatCount="indefinite"/>
  </line>
</svg>