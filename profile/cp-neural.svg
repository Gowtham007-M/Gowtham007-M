<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="130" role="img" aria-label="Animated cyberpunk neural network">
  <defs>
    <linearGradient id="cpn-bg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#05070A"/>
      <stop offset="0.55" stop-color="#0A1622"/>
      <stop offset="1" stop-color="#05070A"/>
    </linearGradient>
    <filter id="cpn-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="130" fill="url(#cpn-bg)"/>

  <g stroke="#22D3EE" stroke-width="0.5" opacity="0.05">
    <line x1="0" y1="32" x2="900" y2="32"/><line x1="0" y1="64" x2="900" y2="64"/>
    <line x1="0" y1="96" x2="900" y2="96"/>
    <line x1="150" y1="0" x2="150" y2="130"/><line x1="300" y1="0" x2="300" y2="130"/>
    <line x1="450" y1="0" x2="450" y2="130"/><line x1="600" y1="0" x2="600" y2="130"/>
    <line x1="750" y1="0" x2="750" y2="130"/>
  </g>

  <g stroke="#22D3EE" stroke-width="1" opacity="0.16">
    <line x1="130" y1="35" x2="450" y2="25"/><line x1="130" y1="35" x2="450" y2="55"/>
    <line x1="130" y1="35" x2="450" y2="90"/><line x1="130" y1="35" x2="450" y2="115"/>
    <line x1="130" y1="65" x2="450" y2="25"/><line x1="130" y1="65" x2="450" y2="55"/>
    <line x1="130" y1="65" x2="450" y2="90"/><line x1="130" y1="65" x2="450" y2="115"/>
    <line x1="130" y1="95" x2="450" y2="25"/><line x1="130" y1="95" x2="450" y2="55"/>
    <line x1="130" y1="95" x2="450" y2="90"/><line x1="130" y1="95" x2="450" y2="115"/>
  </g>
  <g stroke="#A78BFA" stroke-width="1" opacity="0.16">
    <line x1="450" y1="25" x2="760" y2="40"/><line x1="450" y1="25" x2="760" y2="80"/>
    <line x1="450" y1="25" x2="760" y2="120"/>
    <line x1="450" y1="55" x2="760" y2="40"/><line x1="450" y1="55" x2="760" y2="80"/>
    <line x1="450" y1="55" x2="760" y2="120"/>
    <line x1="450" y1="90" x2="760" y2="40"/><line x1="450" y1="90" x2="760" y2="80"/>
    <line x1="450" y1="90" x2="760" y2="120"/>
    <line x1="450" y1="115" x2="760" y2="40"/><line x1="450" y1="115" x2="760" y2="80"/>
    <line x1="450" y1="115" x2="760" y2="120"/>
  </g>

  <text x="130" y="12" text-anchor="middle" font-family="monospace" font-size="9" letter-spacing="2" fill="#64748B">INPUT</text>
  <text x="450" y="12" text-anchor="middle" font-family="monospace" font-size="9" letter-spacing="2" fill="#64748B">HIDDEN</text>
  <text x="760" y="12" text-anchor="middle" font-family="monospace" font-size="9" letter-spacing="2" fill="#64748B">OUTPUT</text>

  <g>
    <circle cx="130" cy="35" r="8" fill="#22D3EE" opacity="0.25"><animate attributeName="r" values="7;10;7" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="35" r="5" fill="#05070A" stroke="#22D3EE" stroke-width="1.5" filter="url(#cpn-glow)"/>
    <circle cx="130" cy="65" r="8" fill="#22D3EE" opacity="0.25"><animate attributeName="r" values="10;7;10" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="65" r="5" fill="#05070A" stroke="#22D3EE" stroke-width="1.5" filter="url(#cpn-glow)"/>
    <circle cx="130" cy="95" r="8" fill="#22D3EE" opacity="0.25"><animate attributeName="r" values="7;9;7" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="95" r="5" fill="#05070A" stroke="#22D3EE" stroke-width="1.5" filter="url(#cpn-glow)"/>
  </g>

  <g>
    <circle cx="450" cy="25" r="8" fill="#A78BFA" opacity="0.25"><animate attributeName="r" values="7;10;7" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="25" r="5" fill="#05070A" stroke="#A78BFA" stroke-width="1.5" filter="url(#cpn-glow)"/>
    <circle cx="450" cy="55" r="8" fill="#F472B6" opacity="0.25"><animate attributeName="r" values="9;7;9" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="55" r="5" fill="#05070A" stroke="#F472B6" stroke-width="1.5" filter="url(#cpn-glow)"/>
    <circle cx="450" cy="90" r="8" fill="#A78BFA" opacity="0.25"><animate attributeName="r" values="8;11;8" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="90" r="5" fill="#05070A" stroke="#A78BFA" stroke-width="1.5" filter="url(#cpn-glow)"/>
    <circle cx="450" cy="115" r="8" fill="#F472B6" opacity="0.25"><animate attributeName="r" values="7;9;7" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="115" r="5" fill="#05070A" stroke="#F472B6" stroke-width="1.5" filter="url(#cpn-glow)"/>
  </g>

  <g>
    <circle cx="760" cy="40" r="8" fill="#22D3EE" opacity="0.25"><animate attributeName="r" values="9;7;9" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="40" r="5" fill="#05070A" stroke="#22D3EE" stroke-width="1.5" filter="url(#cpn-glow)"/>
    <circle cx="760" cy="80" r="8" fill="#F472B6" opacity="0.25"><animate attributeName="r" values="7;10;7" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="80" r="5" fill="#05070A" stroke="#F472B6" stroke-width="1.5" filter="url(#cpn-glow)"/>
    <circle cx="760" cy="120" r="8" fill="#22D3EE" opacity="0.25"><animate attributeName="r" values="8;10;8" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="120" r="5" fill="#05070A" stroke="#22D3EE" stroke-width="1.5" filter="url(#cpn-glow)"/>
  </g>

  <circle r="3" fill="#FFFFFF" filter="url(#cpn-glow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M130 35 L450 55"/>
  </circle>
  <circle r="3" fill="#F472B6" filter="url(#cpn-glow)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="0.7s" path="M450 55 L760 80"/>
  </circle>
  <circle r="3" fill="#A78BFA" filter="url(#cpn-glow)">
    <animateMotion dur="1.6s" repeatCount="indefinite" begin="0.2s" path="M130 95 L450 25"/>
  </circle>
  <circle r="3" fill="#22D3EE" filter="url(#cpn-glow)">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="0.4s" path="M450 25 L760 120"/>
  </circle>
  <circle r="3" fill="#F472B6" filter="url(#cpn-glow)">
    <animateMotion dur="1.9s" repeatCount="indefinite" begin="1.1s" path="M450 115 L760 40"/>
  </circle>

  <rect x="0" y="126" width="5" height="4" fill="#22D3EE">
    <animateMotion dur="4s" repeatCount="indefinite" begin="0.5s" path="M0 0 L298 0 L358 -44 L618 -44 L698 0 L900 0"/>
  </rect>
  <line x1="0" y1="126" x2="900" y2="126" stroke="#22D3EE" stroke-width="1" opacity="0.25"/>
</svg>