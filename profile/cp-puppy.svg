<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="260" height="220" role="img" aria-label="Cyber puppet with wagging tail and blinking neon eye">
  <defs>
    <filter id="cpp-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="260" height="220" rx="16" fill="#0B1220" stroke="#22D3EE" stroke-width="1" opacity="0.9"/>

  <g stroke="#22D3EE" stroke-width="0.5" opacity="0.06">
    <line x1="0" y1="55" x2="260" y2="55"/>
    <line x1="0" y1="110" x2="260" y2="110"/>
    <line x1="0" y1="165" x2="260" y2="165"/>
    <line x1="65" y1="0" x2="65" y2="220"/>
    <line x1="130" y1="0" x2="130" y2="220"/>
    <line x1="195" y1="0" x2="195" y2="220"/>
  </g>

  <g filter="url(#cpp-glow)">
    <g transform="translate(52 136)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-18 0 0;20 0 0;-18 0 0" dur="0.7s" repeatCount="indefinite"/>
        <polygon points="0,0 -10,-26 -18,-46 -6,-50 0,-28 4,-6" fill="#131C2B" stroke="#475569" stroke-width="1.5"/>
        <circle cx="-6" cy="-49" r="3" fill="#F472B6">
          <animate attributeName="opacity" values="1;0.4;1" dur="0.7s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <rect x="40" y="118" width="84" height="58" rx="22" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <circle cx="62" cy="156" r="24" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <path d="M70,134 L118,126 M64,164 L100,158" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.3"/>
    <rect x="100" y="160" width="16" height="26" rx="7" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="120" y="158" width="14" height="28" rx="7" fill="#0F172A" stroke="#334155" stroke-width="2"/>

    <circle cx="100" cy="134" r="9" fill="#06B6D4" opacity="0.18">
      <animate attributeName="r" values="7;10;7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="134" r="3" fill="#06B6D4" opacity="0.7"/>

    <polygon points="118,84 130,62 150,62 162,84 150,106 130,106" fill="#131C2B" stroke="#475569" stroke-width="2"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 130 58;9 130 58;0 130 58" dur="2.4s" repeatCount="indefinite"/>
      <polygon points="124,66 104,36 136,52" fill="#131C2B" stroke="#F472B6" stroke-width="1.5"/>
    </g>
    <polygon points="152,62 172,34 148,50" fill="#131C2B" stroke="#F472B6" stroke-width="1.5"/>
    <polygon points="156,88 178,92 168,102 150,104" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <circle cx="174" cy="94" r="3.5" fill="#22D3EE"/>
    <circle cx="174" cy="94" r="6" fill="#22D3EE" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <g transform="translate(146 84)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.12;1 1;1 1" keyTimes="0;0.88;0.92;0.96;1" dur="3.6s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="7" ry="7" fill="#22D3EE"/>
        <circle cx="0" cy="-1.5" r="2.5" fill="#FFFFFF"/>
      </g>
    </g>

    <path d="M126,108 Q136,116 152,104" fill="none" stroke="#F472B6" stroke-width="4" stroke-linecap="round"/>
    <circle cx="148" cy="110" r="2.5" fill="#F472B6">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="130" y="207" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="3" fill="#64748B">CYBER-PUP · ONLINE</text>
</svg>