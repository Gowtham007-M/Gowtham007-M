<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="100%" height="140" role="img" aria-label="Holographic neon butterfly flying across">
  <defs>
    <filter id="cpbf-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="140" fill="#05070A"/>
  <g stroke="#A78BFA" stroke-width="0.5" opacity="0.05">
    <line x1="0" y1="35" x2="900" y2="35"/>
    <line x1="0" y1="70" x2="900" y2="70"/>
    <line x1="0" y1="105" x2="900" y2="105"/>
  </g>

  <g>
    <animateMotion path="M -80 100 C 150 22, 330 128, 520 60 S 780 22, 980 88" dur="18s" repeatCount="indefinite"/>
    <g filter="url(#cpbf-glow)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-34 0 0;4 0 0;-34 0 0" dur="0.45s" repeatCount="indefinite"/>
        <path d="M0,-2 -44,-38 -58,-8 -40,4 0,4 Z" fill="#A78BFA" opacity="0.45" stroke="#A78BFA" stroke-width="1.5"/>
        <path d="M-6,-4 -40,-26 -50,-10" fill="none" stroke="#F9A8D4" stroke-width="1" opacity="0.5"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-28 0 0;4 0 0;-28 0 0" dur="0.45s" repeatCount="indefinite" begin="-0.12s"/>
        <path d="M0,4 -34,12 -40,40 -14,38 0,12 Z" fill="#F472B6" opacity="0.4" stroke="#F472B6" stroke-width="1.5"/>
        <path d="M-4,8 -30,16 -34,30" fill="none" stroke="#FBCFE8" stroke-width="1" opacity="0.5"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-34 0 0;4 0 0;-34 0 0" dur="0.45s" repeatCount="indefinite"/>
        <path d="M0,-2 44,-38 58,-8 40,4 0,4 Z" fill="#22D3EE" opacity="0.4" stroke="#22D3EE" stroke-width="1.5"/>
        <path d="M6,-4 40,-26 50,-10" fill="none" stroke="#A5F3FC" stroke-width="1" opacity="0.5"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-28 0 0;4 0 0;-28 0 0" dur="0.45s" repeatCount="indefinite" begin="-0.12s"/>
        <path d="M0,4 34,12 40,40 14,38 0,12 Z" fill="#22D3EE" opacity="0.35" stroke="#22D3EE" stroke-width="1.5"/>
        <path d="M4,8 30,16 34,30" fill="none" stroke="#A5F3FC" stroke-width="1" opacity="0.5"/>
      </g>
      <ellipse cx="0" cy="0" rx="3.5" ry="21" fill="#0F172A" stroke="#F472B6" stroke-width="1.5"/>
      <path d="M0,-20 C2,-8 2,8 0,20" fill="none" stroke="#FBCFE8" stroke-width="1" opacity="0.8" stroke-dasharray="2 3"/>
      <circle cx="0" cy="-25" r="4.5" fill="#E879F9"/>
      <path d="M-2,-28 Q-10,-40 -18,-42" fill="none" stroke="#F472B6" stroke-width="1.2"/>
      <path d="M2,-28 Q10,-40 18,-42" fill="none" stroke="#22D3EE" stroke-width="1.2"/>
      <circle cx="-18" cy="-42" r="2" fill="#F472B6">
        <animate attributeName="opacity" values="1;0.3;1" dur="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="18" cy="-42" r="2" fill="#22D3EE">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <g transform="scale(-1 1)">
    <g>
      <animateMotion path="M -80 60 C 160 112, 330 24, 520 82 S 780 108, 980 52" dur="24s" repeatCount="indefinite"/>
      <g transform="scale(0.62)" filter="url(#cpbf-glow)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-34 0 0;4 0 0;-34 0 0" dur="0.55s" repeatCount="indefinite"/>
          <path d="M0,-2 -44,-38 -58,-8 -40,4 0,4 Z" fill="#22D3EE" opacity="0.4" stroke="#22D3EE" stroke-width="1.5"/>
          <path d="M-6,-4 -40,-26 -50,-10" fill="none" stroke="#A5F3FC" stroke-width="1" opacity="0.5"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-28 0 0;4 0 0;-28 0 0" dur="0.55s" repeatCount="indefinite" begin="-0.15s"/>
          <path d="M0,4 -34,12 -40,40 -14,38 0,12 Z" fill="#22D3EE" opacity="0.35" stroke="#22D3EE" stroke-width="1.5"/>
          <path d="M-4,8 -30,16 -34,30" fill="none" stroke="#A5F3FC" stroke-width="1" opacity="0.5"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-34 0 0;4 0 0;-34 0 0" dur="0.55s" repeatCount="indefinite"/>
          <path d="M0,-2 44,-38 58,-8 40,4 0,4 Z" fill="#F472B6" opacity="0.4" stroke="#F472B6" stroke-width="1.5"/>
          <path d="M6,-4 40,-26 50,-10" fill="none" stroke="#FBCFE8" stroke-width="1" opacity="0.5"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-28 0 0;4 0 0;-28 0 0" dur="0.55s" repeatCount="indefinite" begin="-0.15s"/>
          <path d="M0,4 34,12 40,40 14,38 0,12 Z" fill="#F472B6" opacity="0.35" stroke="#F472B6" stroke-width="1.5"/>
          <path d="M4,8 30,16 34,30" fill="none" stroke="#FBCFE8" stroke-width="1" opacity="0.5"/>
        </g>
        <ellipse cx="0" cy="0" rx="3.5" ry="21" fill="#0F172A" stroke="#22D3EE" stroke-width="1.5"/>
        <circle cx="0" cy="-25" r="4.5" fill="#F472B6"/>
        <path d="M-2,-28 Q-10,-40 -18,-42" fill="none" stroke="#22D3EE" stroke-width="1.2"/>
        <path d="M2,-28 Q10,-40 18,-42" fill="none" stroke="#F472B6" stroke-width="1.2"/>
      </g>
    </g>
  </g>

  <line x1="0" y1="132" x2="900" y2="132" stroke="#F472B6" stroke-width="1" stroke-dasharray="6 8" opacity="0.35">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.4s" repeatCount="indefinite"/>
  </line>
</svg>