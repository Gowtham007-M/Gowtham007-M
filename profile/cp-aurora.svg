<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="100%" height="110" role="img" aria-label="Animated cyberpunk aurora gradient">
  <defs>
    <linearGradient id="cpa-c1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="cpa-c2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="cpa-c3" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="cpa-blur" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="900" height="110" fill="#05070A"/>

  <g transform="translate(-160 0)" opacity="0.3" filter="url(#cpa-blur)">
    <rect width="380" height="120" y="-12" fill="url(#cpa-c1)">
      <animateTransform attributeName="transform" type="translate" values="-160 0;1080 0;-160 0" dur="26s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(400 0)" opacity="0.24" filter="url(#cpa-blur)">
    <rect width="420" height="120" y="-16" fill="url(#cpa-c2)">
      <animateTransform attributeName="transform" type="translate" values="400 0;-720 0;400 0" dur="32s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(180 0)" opacity="0.3" filter="url(#cpa-blur)">
    <rect width="360" height="120" y="-8" fill="url(#cpa-c3)">
      <animateTransform attributeName="transform" type="translate" values="-260 0;900 0;-260 0" dur="20s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g fill="#22D3EE">
    <circle cx="120" cy="26" r="1.2"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="60" r="1"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="30" r="1.3"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.8s" repeatCount="indefinite" begin="0.6s"/></circle>
    <circle cx="700" cy="64" r="1"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.4s" repeatCount="indefinite" begin="1.2s"/></circle>
    <circle cx="840" cy="34" r="1.2"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.6s" repeatCount="indefinite" begin="0.3s"/></circle>
    <circle cx="230" cy="82" r="1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.6s" repeatCount="indefinite" begin="1.8s"/></circle>
    <circle cx="640" cy="18" r="1"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.9s" repeatCount="indefinite" begin="0.9s"/></circle>
  </g>

  <line x1="0" y1="98" x2="900" y2="98" stroke="#22D3EE" stroke-width="1" stroke-dasharray="6 8" opacity="0.35">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.1s" repeatCount="indefinite"/>
  </line>
</svg>